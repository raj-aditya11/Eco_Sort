<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSort AI — Industrial Waste Segregation &amp; Material Quality Control</title>
    <meta name="description" content="Industrial recycling inspection and material-quality assessment application with optical contamination detection and stream triage." />
    <meta property="og:title" content="EcoSort AI — Industrial Waste Segregation &amp; Material Quality Control" />
    <meta property="og:description" content="Industrial recycling inspection and material-quality assessment application with optical contamination detection and stream triage." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Restore theme immediately on initial parse to prevent theme flash
      (function() {
        try {
          var saved = localStorage.getItem('ecosort_theme');
          // If no preference exists, use existing dark theme as default
          var isDark = saved !== null ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F4EE] dark:bg-[#151815] text-[#252923] dark:text-[#E6E8E3] antialiased selection:bg-[#245B45] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
